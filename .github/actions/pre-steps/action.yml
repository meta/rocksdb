name: pre-steps
runs:
  using: composite
  steps:
  - name: Dump system info for diagnostics
    run: |
      echo "=== ulimits (soft) ==="
      ulimit -a -S || true
      echo "=== ulimits (hard) ==="
      ulimit -a -H || true
      echo "=== OS ==="
      uname -a || true
      echo "=== CPU ==="
      if [ "$RUNNER_OS" = "macOS" ]; then
        sysctl machdep.cpu.brand_string hw.ncpu || true
      else
        lscpu || true
        grep -m1 '^microcode' /proc/cpuinfo || true
      fi
    shell: bash
  - name: Install lld linker for faster builds
    run: apt-get update -y && apt-get install -y lld 2>/dev/null || true
    shell: bash
  - name: Setup Environment Variables
    run: |-
      echo "GTEST_THROW_ON_FAILURE=0" >> "$GITHUB_ENV"
      echo "SKIP_FORMAT_BUCK_CHECKS=1" >> "$GITHUB_ENV"
      echo "GTEST_COLOR=1" >> "$GITHUB_ENV"
      echo "CTEST_OUTPUT_ON_FAILURE=1" >> "$GITHUB_ENV"
      echo "CTEST_TEST_TIMEOUT=300" >> "$GITHUB_ENV"
      # These third-party sources are mirrored on the "third-party-deps" GitHub
      # release. To add one, upload the asset here (intentionally hidden):
      # https://github.com/meta/rocksdb/releases/edit/third-party-deps
      # Note how file names are generated below (vs. from the original source)
      # before uploading. Removing or modifying files will break builds for
      # older releases/revisions (not found or checksum mismatch).
      echo "ZLIB_DOWNLOAD_PREFIX=https://github.com/meta/rocksdb/releases/download/third-party-deps/zlib-" >> "$GITHUB_ENV"
      echo "BZIP2_DOWNLOAD_PREFIX=https://github.com/meta/rocksdb/releases/download/third-party-deps/bzip2-" >> "$GITHUB_ENV"
      echo "SNAPPY_DOWNLOAD_PREFIX=https://github.com/meta/rocksdb/releases/download/third-party-deps/snappy-" >> "$GITHUB_ENV"
      echo "LZ4_DOWNLOAD_PREFIX=https://github.com/meta/rocksdb/releases/download/third-party-deps/lz4-" >> "$GITHUB_ENV"
      echo "ZSTD_DOWNLOAD_PREFIX=https://github.com/meta/rocksdb/releases/download/third-party-deps/zstd-" >> "$GITHUB_ENV"
    shell: bash
